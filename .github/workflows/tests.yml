name: Pyme360 checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyme360_test
          POSTGRES_USER: pyme360
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyme360 -d pyme360_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CLOUD_TEST_DATABASE_URL: postgresql://pyme360:test-only-password@127.0.0.1:5432/pyme360_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud API test requirements
        run: python -m pip install -r server/cloud/requirements-test.txt
      - name: Compile Python server
        run: python -m py_compile desktop/launcher.py server/serve-local.py server/sync_local.py server/cloud/app.py server/cloud/validation.py
      - name: Run local and PostgreSQL integration tests
        run: python -m unittest discover -s server/tests -v

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript-model/package-lock.json
      - name: Install React dependencies
        working-directory: typescript-model
        run: npm ci
      - name: Build React application
        working-directory: typescript-model
        run: npm run build
      - name: Run React logic tests
        working-directory: typescript-model
        run: npm test
