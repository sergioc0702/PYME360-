services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pyme360
      POSTGRES_USER: pyme360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyme360-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pyme360-cloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyme360 -d pyme360"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pyme360:pyme360-local-only@postgres:5432/pyme360}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Pyme360 <no-reply@example.com>}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pyme360-cloud-db:
